<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="assets/base.css">

if (location.hostname === 'hanchaen.github.io') gtag('config', 'G-42S3KXR4FK');

<style>
:root{--pt:#D9675F;--soft:#F7E6E2;--soft2:#FBF1EE;--ink:#1F2230;--sub:#7A7F90;--line:#E7E7EA}
body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.6}
.top{background:var(--soft);text-align:center;font-size:12px;font-weight:600;height:36px;line-height:36px}
.hd{height:79px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 30px}.hd .logo img{display:block;width:230px;max-height:64px;object-fit:contain}.hd .right{text-align:right}
.cart{max-width:1080px;margin:50px auto 90px;padding:0 24px}.cart h1{font-size:32px;margin-bottom:8px}.cart-intro{color:var(--sub);margin-bottom:34px}
.cart-grid{display:grid;grid-template-columns:1fr 340px;gap:38px}.cart-list{border-top:2px solid var(--ink)}
.cart-item{display:grid;grid-template-columns:120px 1fr auto;gap:20px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}.cart-item img{width:120px;height:120px;object-fit:cover;border-radius:8px}.cart-item h2{font-size:17px;margin:0 0 4px}.variant{color:var(--sub);margin-bottom:14px}.quantity{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.quantity button{width:38px;height:36px;border:0;background:#fff;font-size:18px;cursor:pointer}.quantity span{min-width:36px;display:grid;place-items:center}.item-side{text-align:right}.item-price{font-size:17px;font-weight:700;white-space:nowrap}.remove{margin-top:12px;border:0;background:none;text-decoration:underline;color:var(--sub);cursor:pointer}
.summary{background:var(--soft2);padding:26px;border-radius:16px;height:max-content}.summary h2{font-size:20px;margin-bottom:20px}.summary-row{display:flex;justify-content:space-between;padding:9px 0}.summary-total{display:flex;justify-content:space-between;border-top:1px solid #decfc9;margin-top:12px;padding-top:18px;font-size:19px;font-weight:700}.cart-actions{display:grid;gap:10px;margin-top:24px}.cart-actions a{height:46px;border-radius:999px;display:grid;place-items:center;text-decoration:none;font-weight:600}.primary{background:#000;color:#fff}.secondary{border:1px solid var(--ink)}
.empty{text-align:center;padding:80px 20px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}.empty h2{font-size:22px;margin-bottom:8px}.empty p{color:var(--sub);margin-bottom:24px}.empty a{display:inline-grid;place-items:center;min-width:180px;height:46px;border-radius:999px;background:#000;color:#fff;text-decoration:none}
.notice{margin-top:22px;color:var(--sub);font-size:12px}.ft{background:var(--soft);padding:40px 30px;font-size:12px}
@media(max-width:760px){.hd{padding:0 16px}.hd .logo img{width:150px}.cart{margin-top:30px;padding:0 16px}.cart-grid{grid-template-columns:1fr}.cart-item{grid-template-columns:88px 1fr}.cart-item img{width:88px;height:88px}.item-side{grid-column:2;text-align:left;display:flex;justify-content:space-between;align-items:center}.summary{order:2}}
</style>
</head>
<body>
<p class="top">선택한 애플 리셋 패치를 확인해 주세요</p>
<header class="hd"><div><a href="./" id="cart-header-home-text">SENMI</a></div><a class="logo" href="./" aria-label="SENMI 홈" id="cart-header-home-logo"><img src="assets/images/senmi-logo.png" alt="SENMI"></a><div class="right"><a href="./#apply" id="cart-header-news">소식 신청</a></div></header>
<main class="cart">
  <h1>장바구니</h1>
  <p class="cart-intro">장바구니는 현재 탭에만 임시로 저장되며 실제 주문이나 결제는 진행되지 않습니다.</p>
  <div id="cart-content" class="cart-grid" hidden>
    <section id="cart-list" class="cart-list" aria-label="장바구니 상품"></section>
    <aside class="summary">
      <h2>주문 금액</h2>
      <div class="summary-row"><span>상품 금액</span><strong id="subtotal">0원</strong></div>
      <div class="summary-row"><span>배송비</span><strong>0원</strong></div>
      <div class="summary-total"><span>합계</span><strong id="cart-total">0원</strong></div>
      <div class="cart-actions"><a class="primary" href="./#apply" id="cart-news-signup">소식 신청</a><a class="secondary" href="./" id="continue-shopping">쇼핑 계속하기</a></div>
      <p class="notice">실습용 장바구니입니다. 주문서와 결제 기능은 제공하지 않습니다.</p>
    </aside>
  </div>
  <section id="empty-cart" class="empty" hidden><h2>장바구니가 비어 있어요</h2><p>애플 리셋 패치 구성을 선택해 담아 보세요.</p><a href="./" id="empty-cart-shop">상품 보러 가기</a></section>
</main>
<footer class="ft">이 페이지는 수업 실습용입니다. 실제 판매·주문·결제는 이루어지지 않습니다.</footer>
<script src="assets/analytics.js?v=20261028-3"></script>
<script src="assets/cart.js?v=20261028-3"></script>
</body>
</html>
